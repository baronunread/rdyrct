pre-commit:
  parallel: false
  jobs:
    # The only hook job left: it repairs instead of complaining, which is the
    # one thing worth spending commit time on. Everything that only reports
    # (lint, react-doctor) runs in CI, where nobody can pass --no-verify.
    - name: format
      glob: "*.{cjs,cts,css,html,js,json,jsonc,jsx,md,mjs,mts,ts,tsx}"
      run: bunx oxfmt --write {staged_files}
      stage_fixed: true
