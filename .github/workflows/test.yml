name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives fallow the full git history it needs to diff
      # against origin/main (see the fallow step below); a shallow checkout
      # has no origin/main ref to compare against.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format, lint, typecheck
        run: |
          bun run format:check
          bun run lint
          bun run check
          bunx tsc -p tsconfig.worker.json --noEmit
          bunx tsc -p tests/worker/tsconfig.json --noEmit
      # Scoped to what this branch changed, gated against
      # fallow-baselines/health.json: fails only on findings the branch
      # introduced, not inherited debt. See AGENTS.md.
      - name: Fallow audit
        run: bun run fallow
      # Prose health for the docs this branch touched (AGENTS.md, README,
      # docs/**). Default --blocking error: the strong LLM tells and
      # filler openers fail CI; passive-voice and hedge words stay
      # advisory. Generated and vendored files are excluded in
      # .style-doctor.json.
      - name: Style Doctor
        run: bun run style

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Worker tests read secrets (BETTER_AUTH_SECRET, CAP_SECRET, ...) out of
      # the ambient miniflare env, which wrangler builds from .dev.vars. Without
      # it those bindings are empty, so auth/rate-limit code 500s instead of
      # behaving: same reason the old single-job workflow copied this before
      # running verify.
      - name: Configure worker test environment
        run: cp .dev.vars.example .dev.vars
      - name: Unit and worker tests
        run: |
          bun run test
          bun run test:worker

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # fetch-depth: 0 so leanest can diff against the PR base (or the
      # previous commit on push).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Both of them. .env carries the VITE_PUBLIC_POSTHOG_* pair that
      # src/app/lib/posthog.ts reads, and CI used to run without it: the
      # analytics path was never exercised here, and in dev mode a missing
      # token makes the loader throw on every capture. A developer with a
      # .env therefore ran a different suite from CI, which is how a green
      # local run reached a red pipeline.
      #
      # The token is the placeholder from .env.example, so nothing lands in
      # a real project, and the funnel test blocks the requests anyway.
      - name: Configure browser test environment
        run: |
          cp .dev.vars.example .dev.vars
          cp .env.example .env
      # On a PR, leanest runs only the specs this diff could affect and hands
      # them to playwright unchanged. It fails open: a judge error or a
      # low-confidence answer runs the full suite. The default provider
      # (classifier.dev) sees the diff and the spec sources; the repo is
      # public, so that's fine. Each shard selects on its own, so a spec can
      # slip through on a PR; main runs the full suite to catch it.
      - name: Browser smoke test, affected specs (shard ${{ matrix.shard }}/3)
        if: github.event_name == 'pull_request'
        uses: baronunread/leanest@v0.2.6
        with:
          framework: playwright
          args: --shard=${{ matrix.shard }}/3
      - name: Browser smoke test, full suite (shard ${{ matrix.shard }}/3)
        if: github.event_name != 'pull_request'
        run: bunx playwright test --shard=${{ matrix.shard }}/3

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Gate the worker's wide-event coverage (see #94, PR #199). Fails the
      # pipeline if `evlog map` drops below 100/100, so a new route without
      # logging can't slip through unreviewed. @evlog/cli is pinned in
      # devDependencies to keep the score stable across CLI releases.
      - name: evlog map score gate
        run: bun run check:observability
