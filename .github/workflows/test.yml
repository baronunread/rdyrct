name: Tests

on:
  pull_request:
    # labeled/unlabeled: adding the `ready` label is what switches a PR from
    # the selected e2e specs to the full sharded suite (see the e2e job).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives fallow the full git history it needs to diff
      # against origin/main (see the fallow step below); a shallow checkout
      # has no origin/main ref to compare against.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format, lint, typecheck
        run: |
          bun run format:check
          bun run lint
          bun run check
          bunx tsc -p tsconfig.worker.json --noEmit
          bunx tsc -p tests/worker/tsconfig.json --noEmit
      # Scoped to what this branch changed, gated against
      # fallow-baselines/health.json: fails only on findings the branch
      # introduced, not inherited debt. See AGENTS.md.
      - name: Fallow audit
        run: bun run fallow
      # Prose health for the docs this branch touched (AGENTS.md, README,
      # docs/**). Default --blocking error: the strong LLM tells and
      # filler openers fail CI; passive-voice and hedge words stay
      # advisory. Generated and vendored files are excluded in
      # .style-doctor.json.
      - name: Style Doctor
        run: bun run style

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Worker tests read secrets (BETTER_AUTH_SECRET, CAP_SECRET, ...) out of
      # the ambient miniflare env, which wrangler builds from .dev.vars. Without
      # it those bindings are empty, so auth/rate-limit code 500s instead of
      # behaving: same reason the old single-job workflow copied this before
      # running verify.
      - name: Configure worker test environment
        run: cp .dev.vars.example .dev.vars
      - name: Unit and worker tests
        run: |
          bun run test
          bun run test:worker

  # Two modes, one job. While a PR is being worked on, leanest runs only the
  # specs its diff can affect (shard 0). Before it merges, the full suite has
  # to pass: labelling the PR `ready` runs everything, sharded three ways, and
  # so does every push to main. AGENTS.md describes the same rule.
  e2e:
    name: ${{ matrix.shard == 0 && 'e2e (selected)' || format('e2e ({0}/3)', matrix.shard) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready')) && '[1,2,3]' || '[0]') }}
    steps:
      # fetch-depth: 0 gives leanest the full git history it needs to diff
      # against origin/main to select which e2e specs this PR can affect.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Both of them. .env carries the VITE_PUBLIC_POSTHOG_* pair that
      # src/app/lib/posthog.ts reads, and CI used to run without it: the
      # analytics path was never exercised here, and in dev mode a missing
      # token makes the loader throw on every capture. A developer with a
      # .env therefore ran a different suite from CI, which is how a green
      # local run reached a red pipeline.
      #
      # The token is the placeholder from .env.example, so nothing lands in
      # a real project, and the funnel test blocks the requests anyway.
      - name: Configure browser test environment
        run: |
          cp .dev.vars.example .dev.vars
          cp .env.example .env
      # On a pull request, leanest selects the e2e specs this diff could
      # affect and runs them through the real Playwright runner. It fails
      # open to the full suite on any judge error, so a broken provider never
      # hides a test. classifier-dev is free and needs no secret. Called
      # directly at a pinned version, not through baronunread/leanest@v1: the
      # action installs an unpinned leanest and re-runs setup-bun with
      # `latest`, which moved this job off the Bun pinned above.
      - name: Browser smoke test (leanest-selected specs)
        if: matrix.shard == 0
        env:
          LEANEST_PROVIDER: classifier-dev
        # 0.2.1, not later: 0.2.2+ only starts when argv[1] is the real
        # cli.js path, so through bunx's bin symlink it exits 0 having run
        # nothing. The grep below fails the job if that ever happens again:
        # a leanest run that never reports a selection is not a pass.
        run: |
          set -o pipefail
          bunx leanest@0.2.1 playwright --base "origin/${{ github.base_ref }}" --dir . 2>&1 | tee leanest.log
          grep -Eq '^Selected [0-9]+ / [0-9]+ tests' leanest.log || {
            echo "::error::leanest reported no selection, so no e2e spec ran"
            exit 1
          }
      - name: Browser smoke test (full suite, shard ${{ matrix.shard }}/3)
        if: matrix.shard != 0
        run: bunx playwright test --shard=${{ matrix.shard }}/3

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Gate the worker's wide-event coverage (see #94, PR #199). Fails the
      # pipeline if `evlog map` drops below 100/100, so a new route without
      # logging can't slip through unreviewed. @evlog/cli is pinned in
      # devDependencies to keep the score stable across CLI releases.
      - name: evlog map score gate
        run: bun run check:observability
