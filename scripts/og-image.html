<!doctype html>
<!--
  Source for public/og.png. Kept in the repo because the last OG image went
  stale silently: it still carried a headline the landing page had dropped.

  To regenerate, with `bun run dev` already running. It has to be served by
  the dev server, because the font stylesheets below resolve through
  /node_modules, so copy it into public/ for the shot and delete it after:
  anything left in public/ ships as a route on the live site.

    cp scripts/og-image.html public/og-image.html
    agent-browser set viewport 1200 630
    agent-browser open https://rdyrct.localhost/og-image.html
    agent-browser screenshot og.png     # writes to the CWD, not a subpath
    mv og.png public/og.png && rm public/og-image.html

  Light, not dark: the OG card is the only surface that cannot follow
  prefers-color-scheme, so it matches the page it previews.

  Keep the headline in step with the h1 in src/app/routes/landing.tsx. The
  image this replaced was still advertising a headline the page had dropped.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>rdyrct og</title>
    <link rel="stylesheet" href="/node_modules/@fontsource-variable/figtree/wght.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource/jetbrains-mono/latin-400.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource/jetbrains-mono/latin-700.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        /* Light tokens, straight from src/app/styles.css */
        --bg: #f7f4ef;
        --surface: #ffffff;
        --border: #ddd5c8;
        --text: #2a2733;
        --muted: #544f61;
        --accent: #745ab8;
        --mint: #35875e;

        background: var(--bg);
        color: var(--text);
        /* Same split the product uses: Figtree for anything read, JetBrains
           Mono for identifiers. See the rdyrct-design skill. */
        font-family: "Figtree Variable", ui-sans-serif, system-ui, sans-serif;
        /* An inset rule, so the card keeps a defined edge on a white feed
           instead of dissolving into it. */
        border: 1px solid var(--border);
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 68px 96px 64px;
      }

      /* The Hop mark without its tile, oversized and bled off the right
         edge. Recessive: it frames, it does not compete. */
      .watermark {
        position: absolute;
        right: -60px;
        top: 50%;
        transform: translateY(-50%);
        width: 460px;
        height: 460px;
        color: var(--border);
        opacity: 0.55;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      /* Set like the logo: Figtree Bold, tracked in (src/app/ui/logo.tsx). */
      .wordmark {
        font-size: 56px;
        font-weight: 700;
        letter-spacing: -0.035em;
      }

      h1 {
        font-size: 62px;
        font-weight: 700;
        line-height: 1.14;
        letter-spacing: -0.03em;
        max-width: 17ch;
        position: relative;
      }

      h1 em {
        font-style: normal;
        color: var(--accent);
      }

      /* A short link is the thing somebody types: mono. */
      .chip {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        margin-top: 34px;
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 22px;
        font-size: 26px;
        position: relative;
      }

      .chip .host {
        color: var(--muted);
      }
      .chip .slug {
        color: var(--mint);
      }

      .middle {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .foot {
        font-size: 22px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <svg class="watermark" viewBox="3.6 7 23.6 17.8" fill="currentColor" aria-hidden="true">
      <path
        d="M6.6 20Q13.4 2.2 19 12.2"
        fill="none"
        stroke="currentColor"
        stroke-width="3.2"
        stroke-linecap="round"
      />
      <circle cx="6.6" cy="20" r="2.5" />
      <circle cx="22.4" cy="17.4" r="3.6" />
      <ellipse cx="22.4" cy="23.3" rx="4.3" ry="1.05" />
    </svg>

    <div class="brand">
      <img src="/connector-icon.svg" width="88" height="88" alt="" />
      <span class="wordmark">rdyrct</span>
    </div>

    <div class="middle">
      <h1>Short links and QR codes <em>on your own domain</em></h1>

      <span class="chip">
        <span><span class="host">go.acme.com/</span><span class="slug">spring</span></span>
      </span>
    </div>

    <p class="foot">
      A free URL shortener and QR code generator. Click tracking with no IP addresses stored.
    </p>
  </body>
</html>
